<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200 個小遊戲</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hub">
  <header class="hero">
    <h1>🎮 200 個小遊戲</h1>
    <p>數學・益智・棋牌・動作・反應・知識，點開就能玩</p>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="搜尋遊戲名稱…">
    <div id="cats"></div>
  </div>
  <p id="count"></p>
  <div id="list"></div>
  <p class="foot"><a href="../index.html">← 回學習實驗室首頁</a></p>
</div>
<div id="player" hidden>
  <div class="bar">
    <button id="back">← 返回</button>
    <h2 id="gname"></h2>
    <button id="restart">↻ 重新開始</button>
  </div>
  <p id="gdesc"></p>
  <div class="stats"><span id="score"></span><span id="best"></span><span id="info"></span></div>
  <div id="stage"></div>
</div>
<script src="js/core.js"></script>
<script src="js/math.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/board.js"></script>
<script src="js/arcade.js"></script>
<script src="js/arcade2.js"></script>
<script src="js/reflex.js"></script>
<script src="js/word.js"></script>
<script src="js/app.js"></script>
</body>
</html>
