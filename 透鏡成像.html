<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-4 透鏡成像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --bg:#f1f2f8; --surface:#ffffff; --fg:#191c2e; --muted:#5b6078; --line:#d8dbe8;
  --accent:#5b4bb7; --accent-soft:#ebe8fb; --warm:#d9480f; --good:#15803d; --bad:#c92a2a;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:clamp(15px,1.05vw,21px);line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:10px 24px 8px}
.unit{font-family:var(--display);font-weight:900;font-size:2em;color:var(--accent);line-height:1}
h1{font-family:var(--display);font-weight:900;font-size:1.8em;margin:0;line-height:1.1}
nav.tabs{margin-left:auto;display:flex;gap:10px}
nav.tabs button{font:inherit;font-weight:700;padding:.4em 1.1em;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs small{display:block;font-weight:500;font-size:.72em;opacity:.8;line-height:1.2}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 24px 12px}
.panel{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
.panel.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .sp{flex:1}
.btn{font:inherit;font-weight:700;padding:.3em .9em;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--warm);border-color:var(--warm);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.ghost{border-style:dashed}
.chip{font:inherit;font-weight:700;padding:.25em .8em;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip b{color:var(--accent);margin-right:.35em}
.chip.past{color:var(--fg);border-color:#bdb5ec}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on b{color:#fff}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:12px;overflow:hidden;margin-right:6px}
.seg button{font:inherit;font-weight:700;border:0;padding:.3em .9em;background:var(--surface);color:var(--accent);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.stage{flex:1;min-height:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;touch-action:none}
.cap{font-size:1.15em;font-weight:500;min-height:1.7em;display:flex;align-items:center;gap:12px}
.cap .txt{flex:1}
/* 實驗記錄 */
.rec{display:flex;gap:10px;height:7.6em;align-items:stretch;overflow:hidden}
.rec .empty{color:var(--muted);align-self:center;font-size:.95em}
.card{flex:0 0 auto;width:10.2em;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 6px;display:flex;flex-direction:column;align-items:stretch;font-size:.82em;line-height:1.3}
.card .ln{white-space:nowrap;font-weight:700}
.card .ln small{color:var(--muted);font-weight:500;margin-left:.3em}
.card .ln.o{color:var(--warm)}
.card .ln.i{color:var(--accent)}
.card svg{width:100%;flex:1;min-height:0;border-radius:8px}
.card b{color:var(--accent)}
/* 控制列 */
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl input[type=range]{flex:1;min-width:200px;accent-color:var(--accent);height:28px}
.ctrl .lbl{font-weight:700;color:var(--muted)}
.ctrl .read{font-weight:700;color:var(--accent);min-width:5.5em;text-align:right}
/* 表格 */
.tablewrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.quiz{display:none;align-items:center;gap:18px;background:#fff4ec;border:2px solid var(--warm);border-radius:16px;padding:.5em 1em}
.quiz.on{display:flex}
.quiz .q{font-family:var(--display);font-weight:900;font-size:1.6em}
.quiz .g{color:var(--muted);font-weight:700;font-size:1.1em}
table.sum{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden;font-size:1.35em}
table.sum th,table.sum td{padding:.55em .6em;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.sum th{background:var(--accent-soft);color:var(--accent);font-weight:700}
table.sum tr:last-child td{border-bottom:0}
table.sum td.lens{font-family:var(--display);font-weight:900;font-size:1.1em}
table.sum td.pos{font-weight:700;white-space:nowrap}
table.sum td.ans{cursor:pointer;min-width:5em}
table.sum td.ans.hid{color:#c5c8d8}
table.sum td.ans.show{animation:pop .45s ease}
table.sum td.ans.real{color:var(--good);font-weight:700}
table.sum td.ans.virt{color:var(--accent);font-weight:700}
table.sum tr.hot td{background:#fff4ec}
.play{font:inherit;border:0;background:none;color:var(--warm);cursor:pointer;font-size:.9em;padding:0 0 0 .3em}
.rules{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 12px}
.rules svg{display:block;width:100%;max-height:25vh}
.rhead{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.rhead .chip{font-size:.85em;padding:.15em .8em}
.rhead{position:relative}
.rhead .mnav{margin-left:auto;display:flex;gap:6px}
.rhead .mnav .btn{font-size:.85em;padding:.15em .8em}
.rules.tall svg{max-height:calc(100vh - 250px)}
.rhead .rule{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:700;color:var(--accent);font-size:1.05em}
table.sum.compact{font-size:1.15em}
table.sum.compact th,table.sum.compact td{padding:.28em .6em}
#stepsD{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <span class="unit">4-4</span><h1>透鏡成像</h1>
  <nav class="tabs" id="tabs">
    <button data-p="pA" class="on">① 實驗觀察<small>實驗 4-2</small></button>
    <button data-p="pB">② 沙盤推演<small>兩條光線</small></button>
    <button data-p="pC">③ 表格統整<small>先猜再揭曉</small></button>
    <button data-p="pD">④ 光學儀器<small>顯微鏡・望遠鏡・相機</small></button>
  </nav>
</header>
<main>
  <!-- ① 實驗觀察 -->
  <section class="panel on" id="pA">
    <div class="bar" id="barA"></div>
    <div class="stage"><svg id="svgA" viewBox="0 0 1640 525"></svg></div>
    <div class="ctrl" id="ctrlA" style="display:none">
      <span id="presetsA"></span>
      <span class="lbl">遠</span><input type="range" id="uSliderA" min="-40" max="-3" step="0.1" value="-30"><span class="lbl">近</span>
      <span class="read" id="uReadA"></span>
    </div>
    <div class="cap"><span class="txt" id="capA"></span>
      <button class="btn primary" id="recBtn">📸 記錄</button><button class="btn ghost" id="recClr">清除</button></div>
    <div class="rec" id="rec"><span class="empty">按「記錄」把每次看到的像排在這裡</span></div>
  </section>

  <!-- ② 沙盤推演 -->
  <section class="panel" id="pB">
    <div class="bar" id="barB">
      <span class="seg" id="lensSeg"><button data-t="convex" class="on">凸透鏡</button><button data-t="concave">凹透鏡</button></span>
    </div>
    <div class="stage"><svg id="svgB" viewBox="0 0 1600 660"></svg></div>
    <div class="ctrl">
      <span id="presets"></span>
      <span class="lbl">遠</span><input type="range" id="uSlider" min="-3.4" max="-0.25" step="0.01" value="-2.6"><span class="lbl">近</span>
      <span class="read" id="uRead"></span>
    </div>
    <div class="cap"><span class="txt" id="capB"></span></div>
  </section>

  <!-- ③ 表格統整 -->
  <section class="panel" id="pC">
    <div class="bar">
      <button class="btn primary" id="qPick">🎲 抽一題</button>
      <button class="btn" id="tAll">全部顯示</button>
      <button class="btn ghost" id="tClr">清空</button>
      <button class="btn" id="tRule">📏 判斷法</button>
      <span class="sp"></span>
      <span style="color:var(--muted)">點 ？ 可單格翻開；▶ 到沙盤看作圖</span>
    </div>
    <div class="tablewrap">
      <div class="quiz" id="quiz"><span class="q" id="qText"></span><span class="g">先猜：實／虛．正／倒．大／小</span><span class="sp" style="flex:1"></span><button class="btn primary" id="qShow">▶ 揭曉</button></div>
      <table class="sum" id="sumTable"></table>
      <div class="rules" id="rules" hidden>
        <div class="rhead"><button class="chip on" data-r="a">實虛．正倒．大小</button><button class="chip" data-r="b">成像位置</button><button class="chip" data-r="c">多點成像</button>
          <span class="rule" id="ruleTxt" hidden>物體往右，像也往右；物體往左，像也往左</span>
          <span class="mnav" id="mNav" hidden><button class="btn" id="mPrev">← 上一個</button><button class="btn primary" id="mNext">下一個 →</button></span></div>
        <svg id="ruleSvg" viewBox="0 0 1600 290"></svg></div>
    </div>
  </section>
  <!-- ④ 光學儀器 -->
  <section class="panel" id="pD">
    <div class="bar">
      <span class="seg" id="instSeg"><button data-i="mic" class="on">顯微鏡</button><button data-i="tel">望遠鏡</button><button data-i="cam">相機</button></span>
      <div id="stepsD"></div>
    </div>
    <div class="stage"><svg id="svgD" viewBox="0 0 1600 660"></svg></div>
    <div class="ctrl" id="ctrlD">
      <span class="lbl" id="lblD">標本</span><span class="lbl" id="lblD1">遠</span><input type="range" id="uSliderD" min="-2" max="-1.25" step="0.01" value="-1.35"><span class="lbl" id="lblD2">近</span>
      <span class="read" id="uReadD"></span>
    </div>
    <div class="cap"><span class="txt" id="capD"></span></div>
  </section>
</main>

<script>
/* ===================== 共用 ===================== */
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let autoT=[];
function stopAuto(){autoT.forEach(clearTimeout);autoT=[]}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(parent,x,y,s,attrs){const t=el('text',Object.assign({x,y,'font-family':'Noto Sans TC, Microsoft JhengHei, sans-serif'},attrs||{}),parent);t.textContent=s;return t}
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function dragX(svg,target,onMove){
  target.addEventListener('pointerdown',e=>{
    e.preventDefault(); // 重畫會換掉 target，所以監聽掛在 window
    const mv=ev=>onMove(svgPt(svg,ev).x);
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
}
function mkBar(host,labels,go){
  const prev=document.createElement('button');prev.className='btn';prev.textContent='← 上一步';
  const next=document.createElement('button');next.className='btn primary';next.textContent='下一步 →';
  const sp=document.createElement('span');sp.className='sp';
  const chips=labels.map((t,i)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<b>${i+1}</b>${t}`;b.addEventListener('click',()=>go(i));return b});
  let cur=0;
  prev.addEventListener('click',()=>go(cur-1));next.addEventListener('click',()=>go(cur+1));
  host.append(...chips,sp,prev,next);
  return {refresh(s){cur=s;chips.forEach((c,i)=>{c.classList.toggle('on',i===s);c.classList.toggle('past',i<s)});prev.disabled=s===0;next.disabled=s===labels.length-1}};
}
/* ∟ 形三色 LED：紅在轉角、綠在上、藍在右（cm，y 向上） */
const LEDS=[{x:-.75,y:-.75,c:'#ff3b30'},{x:-.75,y:.75,c:'#2fd158'},{x:.75,y:-.75,c:'#3d7bff'}];
let fxId=0;
/* 在 g 中畫 LED。m：放大率（負＝倒立，旋轉 180°）；k：px/cm；core：LED 半徑 cm；
   spread：額外模糊半徑 cm；alpha：亮度 */
function drawLEDs(g,cx,cy,k,m,core,spread,alpha,ids){
  const id='fx'+(++fxId);ids&&ids.push(id);
  const soft=(.05+spread*.12)*k;
  const f=el('filter',{id,filterUnits:'userSpaceOnUse',x:-4000,y:-4000,width:9000,height:9000},g);
  el('feGaussianBlur',{stdDeviation:soft.toFixed(2)},f);
  const gg=el('g',{filter:`url(#${id})`},g);
  for(const L of LEDS){
    el('circle',{cx:cx+m*L.x*k,cy:cy-m*L.y*k,r:Math.max(1.5,(core+spread)*k),fill:L.c,'fill-opacity':alpha.toFixed(3),style:'mix-blend-mode:screen'},gg);
  }
}
function drawGhost(g,cx,cy,k,core){
  for(const L of LEDS)el('circle',{cx:cx+L.x*k,cy:cy-L.y*k,r:core*k,fill:'none',stroke:'#ffffff','stroke-opacity':.55,'stroke-width':2.5,'stroke-dasharray':'6 5'},g);
}
/* 蠟燭：h＝底到火焰尖的高度（px），dir 1 正立／-1 倒立；mode obj|real|virtual|ghost|glow */
const C_BODY='M-17,0 V-58 Q0,-62 17,-58 V0 Z', C_FLAME='M0,-100 C9,-88 13,-78 9,-71 C6,-66 -6,-66 -9,-71 C-13,-78 -9,-88 0,-100 Z', C_CORE='M0,-88 C4,-81 5,-76 3,-73 C1,-71 -1,-71 -3,-73 C-5,-76 -4,-81 0,-88 Z';
function drawCandle(g,x,yb,h,dir,mode){
  const sc=h/100, c=el('g',{transform:`translate(${x},${yb}) scale(${sc},${dir*sc})`},g);
  const ns='non-scaling-stroke';
  if(mode==='ghost'){
    for(const d of [C_BODY,C_FLAME])el('path',{d,fill:'none',stroke:'#1d1f2b','stroke-opacity':.7,'stroke-width':6,'vector-effect':ns},c);
    for(const d of [C_BODY,C_FLAME])el('path',{d,fill:'none',stroke:'#ffffff','stroke-opacity':.65,'stroke-width':2.5,'stroke-dasharray':'7 6','vector-effect':ns},c);
    return c;
  }
  const line=mode==='real'?'#15803d':mode==='virtual'?'#15803d':'#191c2e';
  const dash=mode==='virtual'?'8 6':'none', fo=mode==='virtual'?.45:1, sw=mode==='glow'?0:mode==='obj'?2.5:3;
  if(mode==='glow'){
    const id='cg'+(++fxId), f=el('filter',{id,x:'-150%',y:'-60%',width:'400%',height:'220%'},c);
    el('feGaussianBlur',{stdDeviation:6},f);
    el('path',{d:C_FLAME,fill:'#ff9f1c',transform:'scale(1.6) translate(0,30)',opacity:.55,filter:`url(#${id})`},c);
  }
  el('path',{d:C_BODY,fill:mode==='glow'?'#f6ead0':'#f4e7c8','fill-opacity':fo,stroke:line,'stroke-width':sw,'stroke-dasharray':dash,'vector-effect':ns},c);
  el('line',{x1:0,y1:-58,x2:0,y2:-68,stroke:'#3a3d52','stroke-width':2,'stroke-opacity':fo,'vector-effect':ns},c);
  el('path',{d:C_FLAME,fill:'#ff8a1c','fill-opacity':fo,stroke:mode==='glow'?'none':(mode==='obj'?'#d9480f':line),'stroke-width':sw,'stroke-dasharray':dash,'vector-effect':ns},c);
  el('path',{d:C_CORE,fill:'#ffe066','fill-opacity':fo},c);
  return c;
}
function drawEye(g,x,y,s){ /* 朝左看的眼睛 */
  const e=el('g',{transform:`translate(${x},${y}) scale(${s})`},g);
  el('path',{d:'M-30,0 Q0,-24 30,0 Q0,24 -30,0 Z',fill:'#fff',stroke:'#191c2e','stroke-width':3},e);
  el('circle',{cx:-8,cy:0,r:10,fill:'#5b4bb7'},e);el('circle',{cx:-10,cy:0,r:4.5,fill:'#191c2e'},e);
  return e;
}

/* ===================== 分頁 ===================== */
let curPanel='pA';
function showPanel(id){
  curPanel=id;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===id));
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{stopAuto();showPanel(b.dataset.p)}));

/* ===================== ① 實驗觀察 ===================== */
const A=(()=>{
  const svg=$('#svgA');
  const PX=10.6, LX=496, AY=245, RAIL=395, F=10, AP=4; // px/cm、透鏡位置、主軸、軌道、焦距 cm、透鏡口徑 cm
  const BOX={x:1180,y:52,w:440,h:390}, BC={x:1180+220,y:52+195}, ER=185;
  const st={step:0,d:22,u:30,s:24,eye:false};
  const sx=cm=>LX+cm*PX;
  const vOf=u=>u===F?Infinity:u*F/(u-F);
  const LABELS=['找焦距','量焦距','2f 外','2f 上','2f～f','放在 f','f 以內','滑動觀察'];
  const CAPS=[
    '太陽光穿過透鏡。拖動白紙，找出最小、最亮的光點。',
    '量出透鏡到光點的距離，這就是 f。尺上標出 f 和 2f。',
    '燈具放在 2f 外。拖動屏幕直到像最清楚，按「記錄」。',
    '燈具移到 2f 上。重新對焦，看看像和剛才有什麼不同。',
    '燈具移到 2f 和 f 之間。重新對焦並記錄。',
    '燈具放在 f 上。屏幕找得到清楚的像嗎？換眼睛看看。',
    '燈具移進 f 以內。屏幕找不到像，就用眼睛透過透鏡看。',
    '拖動滑桿，讓燈具從遠處慢慢靠近；屏幕會自動對焦。'];
  const SLIDE=7;
  function autoFocus(){ // 滑動觀察：屏幕跟著對焦，f 內改用眼睛
    if(st.step!==SLIDE)return;
    if(st.u<F-1e-9)st.eye=true;
    else{st.eye=false;if(st.u>F+1e-9)st.s=Math.min(vOf(st.u),61)}
  }
  const base=el('g',{},svg), dyn=el('g',{},svg), insetG=el('g',{},svg), handles=el('g',{},svg);
  let insetIds=[];
  // ---- 靜態：軌道、尺、透鏡 ----
  function drawBase(){
    base.replaceChildren();
    el('rect',{x:sx(-44),y:RAIL,width:105*PX,height:16,rx:6,fill:'#c9ccd9'},base);
    el('rect',{x:sx(-44),y:RAIL+26,width:105*PX,height:46,rx:6,fill:'#fbf3dc',stroke:'#e2d3a6','stroke-width':2},base);
    for(let cm=-44;cm<=61;cm++){
      const x=sx(cm),big=cm%10===0,mid=cm%5===0;
      el('line',{x1:x,y1:RAIL+26,x2:x,y2:RAIL+26+(big?18:mid?12:7),stroke:'#8a7a4a','stroke-width':big?2:1},base);
      if(big&&cm!==0)txt(base,x,RAIL+64,Math.abs(cm),{'font-size':17,fill:'#7a6a3a','text-anchor':'middle'});
    }
    if(st.step>=1){
      for(const k of [-2,-1,1,2]){
        const x=sx(k*F);
        el('path',{d:`M${x},${RAIL+74} l-9,14 h18 Z`,fill:'#5b4bb7'},base);
        txt(base,x,RAIL+112,(Math.abs(k)===2?'2f':'f'),{'font-size':22,'font-weight':700,fill:'#5b4bb7','text-anchor':'middle'});
      }
    }
    el('line',{x1:sx(-43),y1:AY,x2:sx(60),y2:AY,stroke:'#b8bccd','stroke-width':1.5,'stroke-dasharray':'8 8'},base);
    el('rect',{x:LX-4,y:AY+60,width:8,height:RAIL-AY-60,fill:'#7d8197'},base);
    el('ellipse',{cx:LX,cy:AY,rx:11,ry:78,fill:'#cfe8f6',stroke:'#6aaed6','stroke-width':3},base);

    bar=mkBar(h,LAB[st.inst],go);st.step=0;st.u=1.35;st.lens=600;setupCtrl();bar.refresh(0);draw();
  }
  document.querySelectorAll('#instSeg button').forEach(b=>b.addEventListener('click',()=>{
    st.inst=b.dataset.i;document.querySelectorAll('#instSeg button').forEach(c=>c.classList.toggle('on',c===b));build();
  }));
  build();
  return {go,get step(){return st.step}};
})();

/* ===================== 鍵盤 ===================== */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  const P=curPanel==='pA'?A:curPanel==='pB'?B:curPanel==='pD'?D:null;
  if(curPanel==='pC'&&C.multiOn&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();C.multiNext(e.key==='ArrowRight'?1:-1)}
  else if(e.key==='ArrowRight'&&P){e.preventDefault();P.go(P.step+1)}
  else if(e.key==='ArrowLeft'&&P){e.preventDefault();P.go(P.step-1)}
  else if(e.key==='1')showPanel('pA');else if(e.key==='2')showPanel('pB');else if(e.key==='3')showPanel('pC');else if(e.key==='4')showPanel('pD');
});
</script>
</body>
</html>
